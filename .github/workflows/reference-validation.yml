name: Reference validation

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-references:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Build HBMSim
        run: cmake -S . -B build -G Ninja && cmake --build build && ctest --test-dir build --output-on-failure
      - name: Generate HBMSim baseline metrics
        run: |
          python3 tools/validation/generate_microtraces.py
          python3 tools/validation/summarize_hbmsim.py ./build/hbmsim
      - name: Fetch pinned reference sources
        run: |
          git clone https://github.com/CMU-SAFARI/ramulator2.git reference-ramulator2
          git -C reference-ramulator2 checkout 72427a1bba3771564c4fb0e494ba02242fd1eaa7
          git clone https://github.com/tukl-msd/DRAMSys.git reference-dramsys
          git -C reference-dramsys checkout c8475150551e4348434b56f5111a966bdf0d81f9
      - name: Prepare common reference inputs
        run: python3 tools/validation/prepare_reference_inputs.py --dramsys-root reference-dramsys
      - name: Build Ramulator 2.1
        run: |
          python3 tools/validation/patch_ramulator_drain.py reference-ramulator2 --record validation/reference-inputs/ramulator2-drain-adapter.txt
          cmake -S reference-ramulator2 -B build-ramulator2 -G Ninja -DRAMULATOR_PYTHON_BINDINGS=ON
          cmake --build build-ramulator2
      - name: Run Ramulator 2.1 HBM2 traces
        run: PYTHONPATH="$GITHUB_WORKSPACE/reference-ramulator2/python" python3 tools/validation/run_ramulator.py
      - name: Build DRAMSys
        run: cmake -S reference-dramsys -B build-dramsys -G Ninja -DDRAMSYS_BUILD_TRACE_ANALYZER=OFF && cmake --build build-dramsys
      - name: Run DRAMSys HBM2 traces
        run: python3 tools/validation/run_dramsys.py ./build-dramsys/bin/DRAMSys
      - name: Compose three-simulator comparison
        run: python3 tools/validation/compose_comparison.py
      - name: Publish comparison in Actions summary
        run: |
          echo '## Three-simulator HBM microtrace comparison' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is a same-request-sequence baseline; see the CSV scope column before interpreting differences as strict equivalence.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```csv' >> "$GITHUB_STEP_SUMMARY"
          cat validation/results/three-simulator-comparison.csv >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: hbm-validation-results
          path: validation/
